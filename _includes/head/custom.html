<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

{% if page.post_style %}
<style>
{% assign ps = page.post_style %}
{% if ps.title_font == "courier" %}.page__title { font-family: 'Courier New', monospace !important; }{% endif %}
{% if ps.title_font == "sans" %}.page__title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important; }{% endif %}
{% if ps.body_font == "sans" %}.page__content, .page__content p, .page__content li { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important; }{% endif %}
{% if ps.heading_color %}.page__content h1, .page__content h2 { color: {{ ps.heading_color }} !important; border-left-color: {{ ps.heading_color }}55 !important; }{% endif %}
{% if ps.subheading_color %}.page__content h3, .page__content h4 { color: {{ ps.subheading_color }} !important; border-left-color: {{ ps.subheading_color }}55 !important; }{% endif %}
{% if ps.cmd_color %}pre code { color: {{ ps.cmd_color }} !important; }{% endif %}
{% if ps.code_bg %}pre { background: {{ ps.code_bg }} !important; }{% endif %}
{% if ps.inline_code_color %}.page__content code:not(pre code), p code, li code { color: {{ ps.inline_code_color }} !important; }{% endif %}
</style>
{% endif %}

<!-- Netlify Identity — required for Decap CMS OAuth redirect on all pages -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function(user) {
      if (!user) {
        window.netlifyIdentity.on("login", function() {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

<!-- Google Consent Mode v2 — MUST load before AdSense/Analytics -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  // Default: all consent denied until user responds to CMP banner
  gtag('consent', 'default', {
    'ad_storage':              'denied',
    'ad_user_data':            'denied',
    'ad_personalization':      'denied',
    'analytics_storage':       'denied',
    'functionality_storage':   'denied',
    'personalization_storage': 'denied',
    'security_storage':        'granted',
    'wait_for_update':         500
  });
  gtag('set', 'ads_data_redaction', true);
  gtag('set', 'url_passthrough',    true);
</script>

<!-- Google AdSense (loads after consent defaults are set) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6011990314535755" crossorigin="anonymous"></script>

<script>
/* ── Single listener: build PHASES first, then append CONNECT last ── */
window.addEventListener('DOMContentLoaded', function () {
  var sidebar  = document.querySelector('.sidebar');
  var urlsWrap = document.querySelector('.author__urls-wrapper');

  /* ── STEP 1: Build PHASES (page TOC) if headings exist ── */
  var content = document.querySelector('.page__content');
  var navList  = document.querySelector('.sidebar .nav__list');

  if (content && navList) {
    var headings = Array.from(content.querySelectorAll('h2[id], h3[id]'));

    if (headings.length) {
      function styleLink(a, isSub) {
        a.style.setProperty('color',           '#9fef00',    'important');
        a.style.setProperty('background',      'transparent','important');
        a.style.setProperty('text-decoration', 'none',       'important');
        a.style.setProperty('display',         'block',      'important');
        a.style.setProperty('font-family',     "'Courier New', monospace", 'important');
        a.style.setProperty('font-size',       isSub ? '10px' : '11px', 'important');
        a.style.setProperty('font-weight',     '700',        'important');
        a.style.setProperty('padding',         isSub ? '3px 9px 3px 18px' : '4px 9px', 'important');
        a.style.setProperty('margin-bottom',   '2px',        'important');
        a.style.setProperty('border-left',     '2px solid transparent', 'important');
        a.style.setProperty('border-top',      'none',       'important');
        a.style.setProperty('border-right',    'none',       'important');
        a.style.setProperty('border-bottom',   'none',       'important');
        a.style.setProperty('border-radius',   '0',          'important');
        a.style.setProperty('transition',      'background .12s, color .12s', 'important');
        if (isSub) a.style.setProperty('color', '#aaaaaa', 'important');

        a.addEventListener('mouseover', function () {
          this.style.setProperty('background', '#ff0000', 'important');
          this.style.setProperty('color',      '#000000', 'important');
        });
        a.addEventListener('mouseout', function () {
          this.style.setProperty('background', 'transparent', 'important');
          var active = this.classList.contains('bo-active');
          this.style.setProperty('color', active ? '#ff4444' : (isSub ? '#aaaaaa' : '#9fef00'), 'important');
        });
      }

      var wrap = document.createElement('div');
      wrap.id  = 'bo-toc-wrap';
      wrap.style.marginTop = '4px';

      var titleEl = document.createElement('p');
      titleEl.className = 'nav__title';
      wrap.appendChild(titleEl);

      var ul = document.createElement('ul');
      ul.className = 'nav__items';
      ul.style.setProperty('list-style', 'none', 'important');
      ul.style.setProperty('padding',    '0',    'important');
      ul.style.setProperty('margin',     '0',    'important');

      headings.forEach(function (h) {
        var clone = h.cloneNode(true);
        clone.querySelectorAll('a.anchorjs-link, a.header-link, .anchor')
             .forEach(function (el) { el.remove(); });

        var isSub  = h.tagName === 'H3';
        var prefix = isSub ? '↳ ' : '';
        var label  = (prefix + clone.textContent.trim()).replace(/\s+/g, ' ').substring(0, 50);

        var li = document.createElement('li');
        li.style.setProperty('list-style', 'none', 'important');

        var a = document.createElement('a');
        a.href        = '#' + h.id;
        a.textContent = label;
        styleLink(a, isSub);

        li.appendChild(a);
        ul.appendChild(li);
      });

      wrap.appendChild(ul);
      navList.parentNode.appendChild(wrap);

      /* ── Scroll-spy ── */
      function update () {
        var scrollY = window.scrollY + 110;
        var active  = headings[0];
        headings.forEach(function (h) {
          if (h.getBoundingClientRect().top + window.scrollY <= scrollY) active = h;
        });
        ul.querySelectorAll('a').forEach(function (a) {
          var isActive = a.getAttribute('href') === '#' + active.id;
          a.classList.toggle('bo-active', isActive);
          if (isActive) {
            a.style.setProperty('background', '#1a0000', 'important');
            a.style.setProperty('color',      '#ff4444', 'important');
          } else if (!a.matches(':hover')) {
            var sub = a.textContent.startsWith('↳');
            a.style.setProperty('background', 'transparent', 'important');
            a.style.setProperty('color', sub ? '#aaaaaa' : '#9fef00', 'important');
          }
        });
      }

      window.addEventListener('scroll', update, { passive: true });
      update();
    }
  }

  /* ── STEP 2: Move CONNECT to very bottom (always runs after PHASES) ── */
  if (!sidebar || !urlsWrap) return;

  var connectSection = document.createElement('div');
  connectSection.id  = 'bo-connect-section';
  connectSection.style.setProperty('margin-top', '24px', 'important');
  connectSection.style.setProperty('border-top', '1px solid #1e1e1e', 'important');
  connectSection.style.setProperty('padding-top', '10px', 'important');

  var hdr = document.createElement('p');
  hdr.className = 'nav__title';
  hdr.textContent = 'Connect';
  connectSection.appendChild(hdr);

  connectSection.appendChild(urlsWrap);
  sidebar.appendChild(connectSection);

  urlsWrap.querySelectorAll('li a').forEach(function(a) {
    a.style.setProperty('color', '#9fef00', 'important');
    a.style.setProperty('font-family', "'Courier New', monospace", 'important');
    a.style.setProperty('font-size', '12px', 'important');
    a.style.setProperty('text-decoration', 'none', 'important');
    a.addEventListener('mouseover', function() { this.style.setProperty('color', '#ff0000', 'important'); });
    a.addEventListener('mouseout',  function() { this.style.setProperty('color', '#9fef00', 'important'); });
  });

  /* ── STEP 3: Support buttons — after CONNECT, always last ── */
  var supportSection = document.createElement('div');
  supportSection.id = 'bo-support-section';
  supportSection.style.setProperty('margin-top', '18px', 'important');
  supportSection.style.setProperty('border-top', '1px solid #1e1e1e', 'important');
  supportSection.style.setProperty('padding-top', '10px', 'important');

  var sHdr = document.createElement('p');
  sHdr.className = 'nav__title';
  sHdr.textContent = 'Support';
  supportSection.appendChild(sHdr);

  var btnWrap = document.createElement('div');
  btnWrap.style.setProperty('display', 'flex', 'important');
  btnWrap.style.setProperty('flex-direction', 'column', 'important');
  btnWrap.style.setProperty('gap', '7px', 'important');
  btnWrap.style.setProperty('margin-top', '6px', 'important');

  function makeSupBtn(href, label, color) {
    var a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = label;
    a.style.setProperty('display', 'block', 'important');
    a.style.setProperty('font-family', "'Courier New', monospace", 'important');
    a.style.setProperty('font-size', '10px', 'important');
    a.style.setProperty('font-weight', '700', 'important');
    a.style.setProperty('text-decoration', 'none', 'important');
    a.style.setProperty('color', color, 'important');
    a.style.setProperty('border', '1px solid ' + color + '44', 'important');
    a.style.setProperty('border-radius', '4px', 'important');
    a.style.setProperty('padding', '6px 10px', 'important');
    a.style.setProperty('text-align', 'center', 'important');
    a.style.setProperty('transition', 'background .15s, color .15s', 'important');
    a.addEventListener('mouseover', function() {
      this.style.setProperty('background', color, 'important');
      this.style.setProperty('color', '#000', 'important');
    });
    a.addEventListener('mouseout', function() {
      this.style.setProperty('background', 'transparent', 'important');
      this.style.setProperty('color', color, 'important');
    });
    return a;
  }

  btnWrap.appendChild(makeSupBtn('https://buymeacoffee.com/sweshinfosec', '☕ Buy Me a Coffee', '#ffb300'));
  btnWrap.appendChild(makeSupBtn('https://www.patreon.com/c/SweshInfoSec', '⚑ Support on Patreon', '#ff424d'));

  supportSection.appendChild(btnWrap);
  sidebar.appendChild(supportSection);
});
</script>

<!-- ══════════════════════════════════════════════════════
     BlackOps — Most Visited Posts Widget
     Tracks page visits in localStorage, renders top-3
     "You May Also Enjoy" cards per page context.
     ══════════════════════════════════════════════════════ -->
<script>
/* ── Inject current page layout/url for the widget to read ── */
window.BO_PAGE = {
  layout: "{{ page.layout }}",
  url:    "{{ page.url }}"
};
</script>
<script>
(function () {
  /* ── 1. Track this visit ── */
  var _path = window.location.pathname;
  var _vk   = 'bo_v_' + _path;
  try { localStorage.setItem(_vk, (parseInt(localStorage.getItem(_vk) || '0', 10) + 1).toString()); } catch(e) {}

  /* ── 2. Category filter map (permalink → {cats[], fallback}) ── */
  var CAT_MAP = {
    '/':                                    { cats: 'all',               fallback: false },
    '/infosec/':                            { cats: 'infosec',           fallback: false },
    '/infosec/pentest/':                    { cats: 'pentest',           fallback: false },
    '/infosec/pentest/web/':               { cats: ['web-application-pentest','web-application','web','owasp'], fallback: false },
    '/infosec/pentest/cloud/':             { cats: ['cloud-pentest','cloud','aws','azure','gcp'],               fallback: true  },
    '/infosec/pentest/mobile/':            { cats: ['mobile-pentest','mobile','android','ios'],                  fallback: true  },
    '/infosec/pentest/iot/':               { cats: ['iot-pentest','iot','firmware','embedded'],                  fallback: true  },
    '/infosec/red-teaming/':               { cats: ['red-teaming','red-team'],                                   fallback: true  },
    '/infosec/vulnerability-assessment/':  { cats: ['vulnerability-assessment','vapt'],                          fallback: true  },
    '/infosec/malware-analysis/':          { cats: ['malware-analysis','malware'],                               fallback: true  },
    '/infosec/forensic-investigation/':    { cats: ['forensic-investigation','forensics','dfir'],                fallback: true  },
    '/infosec/smart-contracts/':           { cats: ['smart-contracts','smart-contract','solidity','defi'],       fallback: true  },
    '/infosec/threat-modeling/':           { cats: ['threat-modeling','threat-model'],                           fallback: true  },
    '/infosec/risk-assessment/':           { cats: ['risk-assessment','risk'],                                   fallback: true  }
  };

  /* All infosec categories for "infosec" and "pentest" pages */
  var ALL_INFOSEC = [
    'web-application-pentest','cloud-pentest','mobile-pentest','iot-pentest',
    'red-teaming','vulnerability-assessment','malware-analysis','forensic-investigation',
    'smart-contracts','threat-modeling','risk-assessment','bug-bounty','ctf','walkthroughs'
  ];

  /* ── 3. Helpers ── */
  function visits(url) {
    try { return parseInt(localStorage.getItem('bo_v_' + url) || '0', 10); } catch(e) { return 0; }
  }

  function normalize(s) { return (s || '').toLowerCase().replace(/\s+/g, '-'); }

  function postMatchesCats(post, cats) {
    var pc = (post.categories || []).map(normalize);
    var pt = (post.tags       || []).map(normalize);
    return cats.some(function(c) {
      return pc.indexOf(c) !== -1 || pt.indexOf(c) !== -1;
    });
  }

  function filterAndSort(posts, filter, excludeUrl) {
    var primary = posts.filter(function(p) {
      if (p.url === excludeUrl) return false;
      if (!filter || filter.cats === 'all') return true;
      var cats = (filter.cats === 'infosec' || filter.cats === 'pentest') ? ALL_INFOSEC : filter.cats;
      return postMatchesCats(p, cats);
    });
    primary.sort(function(a, b) { return visits(b.url) - visits(a.url); });

    if (filter && filter.fallback && primary.length < 3) {
      var used = primary.map(function(p) { return p.url; });
      var extra = posts.filter(function(p) {
        return p.url !== excludeUrl && used.indexOf(p.url) === -1;
      });
      extra.sort(function(a, b) { return visits(b.url) - visits(a.url); });
      primary = primary.concat(extra);
    }
    return primary.slice(0, 3);
  }

  /* ── 4. Render HTML for the widget ── */
  function renderWidget(posts3) {
    var cards = posts3.map(function(p) {
      var v = visits(p.url);
      var vBadge = v > 1
        ? '<span style="color:#9fef00;font-size:9px;margin-left:6px;letter-spacing:1px;">▲ ' + v + ' views</span>'
        : '';
      return '<div class="bo-card">'
        + '<a class="bo-card-link" href="' + p.url + '" rel="permalink">'
        + '<div class="bo-card-title">' + p.title + '</div>'
        + '<div class="bo-card-meta"><i class="fas fa-calendar-alt"></i> ' + p.date + vBadge + '</div>'
        + (p.excerpt ? '<div class="bo-card-excerpt">' + p.excerpt + '</div>' : '')
        + '</a></div>';
    }).join('');

    return '<div class="bo-most-visited">'
      + '<h4 class="bo-mv-label">YOU MAY ALSO ENJOY</h4>'
      + '<div class="bo-cards-grid">' + cards + '</div>'
      + '</div>';
  }

  /* ── 5. Inject widget — SAME logic for every page type ── */
  document.addEventListener('DOMContentLoaded', function () {
    var layout  = (window.BO_PAGE || {}).layout || '';
    var pageUrl = (window.BO_PAGE || {}).url    || '';
    var isPost  = layout === 'single';
    var filter  = CAT_MAP[_path] || null;

    if (!filter && !isPost) return;

    /* Remove MM's built-in related widget (single posts only) */
    var mmRelated = document.querySelector('.page__related');
    if (mmRelated) mmRelated.remove();

    if (document.querySelector('.bo-most-visited')) return;

    fetch('/posts.json')
      .then(function(r) { return r.json(); })
      .then(function(allPosts) {
        var top3 = filterAndSort(allPosts, filter, isPost ? pageUrl : null);
        if (!top3.length) return;
        var widget = renderWidget(top3);

        /* ── SAME insertion point for ALL page types ──
           • Archive pages  → .archive (the content column beside the sidebar)
           • Single posts   → .page__inner-wrap (gives correct indent,
                               same as post content / share buttons / prev-next)
           Both elements have the same effective width = page minus sidebar.  */
        var contentCol = document.querySelector('#main .archive')   /* listing pages  */
                      || document.querySelector('.page__inner-wrap') /* single posts  */
                      || document.querySelector('#main');
        if (contentCol) contentCol.insertAdjacentHTML('beforeend', widget);
      })
      .catch(function() {});
  });
})();
</script>
