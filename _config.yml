title: "SweshInfoSec"
logo: "/assets/images/Logo.png"
tagline: "Pentesting · Bug Bounty · CVE Research"
description: "Real-world web application security research, VAPT walkthroughs, and bug bounty findings by SweshInfoSec."
url: "https://sweshinfosec.github.io"
baseurl: ""

twitter:
  username: SweshInfoSec

author:
  name: "SweshInfoSec"
  bio: "Security researcher | VAPT | Bug bounty | Penetration Testing"
  avatar: "/assets/images/Logo.png"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:sweshinfosec@gmail.com"
    - label: "Twitter / X"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/SweshInfoSec"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/sweshinfosec"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/sweshinfosec"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://youtube.com/@SweshInfoSec"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/sweshinfosec"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://facebook.com/sweshinfosec"
    - label: "Discord"
      icon: "fab fa-fw fa-discord"
      url: "https://discord.gg/sweshinfosec"

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"

search: true
search_provider: lunr

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

permalink: /:categories/:title/

paginate: 12
paginate_path: /page:num/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
      toc: false
      sidebar:
        nav: "post_toc"

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "UA-XXXXXXXXX-X"
    anonymize_ip: false

include:
  - _pages

exclude:
  - "*.sh"
  - "Gemfile.lock"
  - "README.md"
  - "commitpost.sh"
