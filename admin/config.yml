backend:
  name: git-gateway
  branch: main
  identity_url: "https://lustrous-madeleine-da7ad5.netlify.app/.netlify/identity"
  gateway_url: "https://lustrous-madeleine-da7ad5.netlify.app/.netlify/git"

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# ── Slug format: YYYY-MM-DD-title ──
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ──────────────────────────────────────────
  # BLOG POSTS
  # ──────────────────────────────────────────
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "single"

      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Post headline — shown at top of the page"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "Excerpt / Subtitle"
        name: "excerpt"
        widget: "text"
        hint: "Short description shown under the title and in post listings"
        required: false

      - label: "Category"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - { label: "Web Application Pentest", value: "web-application-pentest" }
          - { label: "Cloud Pentest", value: "cloud-pentest" }
          - { label: "Mobile Pentest", value: "mobile-pentest" }
          - { label: "IoT Pentest", value: "iot-pentest" }
          - { label: "Vulnerability Assessment", value: "vulnerability-assessment" }
          - { label: "Malware Analysis", value: "malware-analysis" }
          - { label: "Forensic Investigation", value: "forensic-investigation" }
          - { label: "Smart Contracts", value: "smart-contracts" }
          - { label: "Red Teaming", value: "red-teaming" }
          - { label: "Threat Modeling", value: "threat-modeling" }
          - { label: "Risk Assessment", value: "risk-assessment" }
          - { label: "Bug Bounty", value: "bug-bounty" }
          - { label: "CTF", value: "ctf" }
          - { label: "Walkthroughs", value: "Walkthroughs" }
        hint: "Pick all that apply — post will appear under each selected category page"

      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        hint: "Comma-separated tags. Use lowercase-hyphenated. e.g. xss, sql-injection, dvwa, rce"

      - label: "Header Style"
        name: "header"
        widget: "object"
        collapsed: true
        hint: "Controls the header banner on the post"
        fields:
          - label: "Overlay colour"
            name: "overlay_color"
            widget: "string"
            default: "#0d0d0d"
            required: false
          - label: "Overlay filter (0–1 darkness)"
            name: "overlay_filter"
            widget: "number"
            default: 0.9
            value_type: float
            min: 0
            max: 1
            step: 0.1
            required: false
          - label: "Teaser image (optional — for post cards)"
            name: "teaser"
            widget: "image"
            required: false
            allow_multiple: false

      - label: "Author Profile Sidebar"
        name: "author_profile"
        widget: "boolean"
        default: true

      - label: "Table of Contents (MM right-side — keep OFF, left PHASES auto-builds)"
        name: "toc"
        widget: "boolean"
        default: false

      - label: "TOC Label"
        name: "toc_label"
        widget: "string"
        default: "Phases"
        required: false

      - label: "Post Styling"
        name: "post_style"
        widget: "object"
        collapsed: true
        hint: "Override fonts, heading colors, and code styling for this post"
        fields:

          - label: "Title font"
            name: "title_font"
            widget: "select"
            required: false
            default: "orbitron"
            options:
              - { label: "Orbitron — techy/hacker (default)", value: "orbitron" }
              - { label: "Courier New — monospace terminal", value: "courier" }
              - { label: "System sans-serif — clean/minimal", value: "sans" }

          - label: "Heading color (H2/H3 in body)"
            name: "heading_color"
            widget: "string"
            default: "#9fef00"
            hint: "Hex color for section headings. Default: #9fef00 (green). Try #ff9800 (orange) or #4488ff (blue)"
            required: false

          - label: "Sub-heading color (H3/H4)"
            name: "subheading_color"
            widget: "string"
            default: "#ff9800"
            hint: "Hex color for H3/H4 sub-headings. Default: #ff9800 (orange)"
            required: false

          - label: "Body font"
            name: "body_font"
            widget: "select"
            required: false
            default: "courier"
            options:
              - { label: "Courier New — terminal (default)", value: "courier" }
              - { label: "System sans-serif — readable/clean", value: "sans" }

          - label: "Command output color"
            name: "cmd_color"
            widget: "string"
            default: "#9fef00"
            hint: "Color for terminal/command output text in code blocks. Default: #9fef00 (green)"
            required: false

          - label: "Code block background"
            name: "code_bg"
            widget: "string"
            default: "#0a0a0a"
            hint: "Background color for code/command blocks. Default: #0a0a0a (near-black)"
            required: false

          - label: "Inline code color"
            name: "inline_code_color"
            widget: "string"
            default: "#ff9800"
            hint: "Color for inline `code` snippets within text. Default: #ff9800 (orange)"
            required: false

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Full post content. Supports Markdown and inline HTML for BlackOps-styled cards."

  # ──────────────────────────────────────────
  # PAGES (About, Privacy Policy, etc.)
  # ──────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    files:

      - label: "About"
        name: "about"
        file: "about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Author Profile", name: "author_profile", widget: "boolean", default: true }
          - { label: "TOC", name: "toc", widget: "boolean", default: true }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Privacy Policy"
        name: "privacy"
        file: "_pages/privacy-policy.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
